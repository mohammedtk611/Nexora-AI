services:
  - type: web
    name: nexora-ai-backend
    env: docker
    region: oregon # or frankfurt, ohio, singapore
    plan: free # Change to starter/standard for production
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health # Standard healthcheck path, assuming /api/v1/health exists
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-ai-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://nexora-ai-nine-gamma.vercel.app,http://localhost:5173"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: GEMINI_FAST_MODEL
        value: "gemini-3.5-flash"

databases:
  - name: nexora-ai-db
    databaseName: nexora_ai
    user: nexora_ai_user
    region: oregon
    plan: free # Change for production
